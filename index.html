<body>
  <!-- Primeiro foco do teclado: a página tem muito scroll e chrome fixo,
       então pular direto para o conteúdo economiza dezenas de tabs. -->
  <a class="qd-skip" href="#top">Pular para o conteúdo</a>
  <div class="grain"></div>
  <div id="root"></div>

  <!-- Filtro de refração usado pelo botão de vidro líquido (LiquidButton).
       Turbulência -> blur -> deslocamento do backdrop -> blur final.
       Sem suporte (Safari), o botão cai para blur simples e continua legível. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="qd-glass-distort" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.05" numOctaves="1" seed="1" result="turbulence" />
      <feGaussianBlur in="turbulence" stdDeviation="2" result="blurredNoise" />
      <feDisplacementMap in="SourceGraphic" in2="blurredNoise" scale="70" xChannelSelector="R" yChannelSelector="B" result="displaced" />
      <feGaussianBlur in="displaced" stdDeviation="4" result="finalBlur" />
      <feComposite in="finalBlur" in2="finalBlur" operator="over" />
    </filter>
  </svg>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
