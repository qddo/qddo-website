<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Marcação temporária das fotos do fecho (footer-word-01..08.jpg).
       Hachura + gradiente quente para deixar claro que é placeholder. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#2f6fb5"/>
      <stop offset="0.42" stop-color="#f2a94e"/>
      <stop offset="0.74" stop-color="#e85420"/>
      <stop offset="1" stop-color="#6d2410"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.76" cy="0.6" r="0.34">
      <stop offset="0" stop-color="#fff6d2" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff6d2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hatch" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="34" stroke="#000" stroke-opacity="0.11" stroke-width="12"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>
  <rect width="1600" height="900" fill="url(#hatch)"/>
</svg>
